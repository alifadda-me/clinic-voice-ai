name: Deploy to Railway

# Runs after CI succeeds on main, or manual dispatch.
# GitHub secrets: RAILWAY_TOKEN, RAILWAY_SERVICE_ID, APP_BASE_URL (optional but recommended)
# See docs/DEPLOYMENT.md

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Railway deploy + migrate + smoke
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing GitHub secret RAILWAY_TOKEN"
            exit 1
          fi
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::error::Missing GitHub secret RAILWAY_SERVICE_ID"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.5.3

      - name: Deploy application
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --ci

      - name: Run database migrations (remote)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --service "${{ secrets.RAILWAY_SERVICE_ID }}" npm run db:migrate

      - name: Post-deploy health check
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "::warning::APP_BASE_URL secret not set — skipping /health and /ready check"
            exit 0
          fi
          sleep 15
          npm run production:check

      - name: Optional derived index rebuild
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          REBUILD_DERIVED_ON_DEPLOY: ${{ secrets.REBUILD_DERIVED_ON_DEPLOY }}
        run: |
          if [ "$REBUILD_DERIVED_ON_DEPLOY" != "true" ]; then
            echo "Skipping rebuild:derived (set REBUILD_DERIVED_ON_DEPLOY=true when Qdrant/Neo4j + embeddings are configured)"
            exit 0
          fi
          railway run --service "${{ secrets.RAILWAY_SERVICE_ID }}" npm run rebuild:derived
